name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `build` roda tsc (com noUnusedLocals/noUnusedParameters) — pega erros de
      # tipo e imports/variáveis mortos sem precisar de lint separado.
      - name: Build (typecheck src)
        run: pnpm -r build

      # Typecheck dos testes (tests/tsconfig.json, rigor igual ao src).
      - name: Typecheck tests
        run: pnpm -r typecheck

      # Testes unitários usam APIs mockadas — não precisam de chaves.
      - name: Unit tests
        run: pnpm -r test:unit
